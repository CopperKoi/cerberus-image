[project]
name = "cerberus-agent"
version = "0.1.0"
description = "Autonomous, evidence-based CTF agent"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.12,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.17,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.13,<1"]

[project.scripts]
cerberus = "cerberus.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cerberus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["B008", "S101", "S105", "S311", "S603", "S607", "S608"]
